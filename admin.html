<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little English 审核后台</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <section class="login-shell" id="loginShell" hidden>
      <form class="login-panel" id="loginForm">
        <p>Little English</p>
        <h1>登录审核后台</h1>
        <label>
          <span>账号</span>
          <input type="text" id="loginUsername" autocomplete="username" value="admin" required />
        </label>
        <label>
          <span>密码</span>
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </label>
        <button type="submit">登录</button>
        <div id="loginMessage" class="admin-message" role="status"></div>
      </form>
    </section>

    <main class="admin-shell" id="adminShell" hidden>
      <header class="admin-header">
        <div>
          <p>Little English</p>
          <h1>内容审核后台</h1>
        </div>
        <div class="header-actions">
          <span id="currentUser"></span>
          <button type="button" id="logoutButton">退出</button>
          <button type="button" id="refreshButton">刷新</button>
        </div>
      </header>

      <section class="toolbar">
        <button type="button" id="newDraftButton">新建草稿</button>
        <button type="button" id="copyPublishedButton">复制为草稿编辑</button>
        <button type="button" id="saveButton">保存草稿</button>
        <button type="button" id="approveButton">审核通过并发布</button>
        <button type="button" id="deleteSceneButton" class="danger-button">删除场景</button>
      </section>
      <div id="message" class="admin-message" role="status"></div>

      <section class="workspace">
        <aside class="scene-list">
          <h2>草稿</h2>
          <div id="draftList"></div>
          <h2>已发布</h2>
          <div id="publishedList"></div>
        </aside>

        <section class="preview-panel">
          <div class="panel-heading">
            <div>
              <p id="statusText">请选择一个场景</p>
              <h2 id="sceneTitle">单词与例句</h2>
            </div>
          </div>
          <form class="scene-form" id="sceneForm"></form>
          <div id="wordPreview"></div>
        </section>
      </section>
    </main>
    <script src="./admin.js"></script>
  </body>
</html>
