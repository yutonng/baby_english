<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fruit Style Preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26313d;
      --muted: #687482;
      --paper: #fffdf8;
      --line: rgba(39, 49, 60, 0.12);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fff7e8 0%, #f4fbff 100%);
      color: var(--ink);
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .note {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .style-row {
      margin: 18px 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 28px rgba(64, 48, 24, 0.09);
    }

    .style-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: grid;
      gap: 12px;
      place-items: center;
      min-height: 222px;
      padding: 16px 12px 18px;
      border-radius: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .frame {
      display: grid;
      place-items: center;
      width: 138px;
      height: 138px;
      border-radius: 28px;
      background: #fff3d8;
    }

    svg {
      width: 118px;
      height: 118px;
      display: block;
    }

    strong {
      font-size: 24px;
      line-height: 1;
    }

    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
      .style-head {
        display: block;
      }
      .desc {
        margin-top: 6px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>水果 SVG 风格候选</h1>
    <p class="note">先只看 apple / orange / banana。选定风格后，再批量应用到其他单词。</p>

    <section class="style-row">
      <div class="style-head">
        <h2>A. 干净图标风</h2>
        <p class="desc">最省体积，最像现在这一版</p>
      </div>
      <div class="cards">
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><ellipse cx="128" cy="145" rx="58" ry="62" fill="#F45D5D"/><ellipse cx="104" cy="145" rx="34" ry="52" fill="#FF7373"/><path d="M128 82c2-23 17-34 35-34" fill="none" stroke="#6F7F3F" stroke-width="12" stroke-linecap="round"/><path d="M139 72c18-20 46-19 58 1-20 17-44 18-58-1z" fill="#7CC46B"/><circle cx="106" cy="126" r="10" fill="#FFD0C2"/></svg>
        </div><strong>apple</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><circle cx="128" cy="145" r="62" fill="#F8961E"/><circle cx="105" cy="126" r="13" fill="#FFB24A"/><circle cx="96" cy="154" r="6" fill="#F7A33A"/><path d="M127 84c6-26 24-37 48-31" fill="none" stroke="#6F7F3F" stroke-width="12" stroke-linecap="round"/><path d="M138 75c16-19 43-17 56 1-18 16-42 16-56-1z" fill="#75B85A"/></svg>
        </div><strong>orange</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><path d="M57 106c36 67 99 92 157 45-54 78-143 65-178-22 8 0 15-8 21-23z" fill="#FFD166"/><path d="M61 107c33 55 87 73 138 41" fill="none" stroke="#E9A83A" stroke-width="10" stroke-linecap="round"/><path d="M38 126c6 5 13 7 21 5M208 150c7-5 12-11 16-18" stroke="#8D5A24" stroke-width="10" stroke-linecap="round"/></svg>
        </div><strong>banana</strong></div>
      </div>
    </section>

    <section class="style-row">
      <div class="style-head">
        <h2>B. 柔和拟物风</h2>
        <p class="desc">更真实，但仍然简单清楚，推荐候选</p>
      </div>
      <div class="cards">
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <defs><radialGradient id="appleB" cx="36%" cy="28%" r="75%"><stop offset="0" stop-color="#ff9b8e"/><stop offset=".45" stop-color="#f15b5b"/><stop offset="1" stop-color="#c93445"/></radialGradient><linearGradient id="leafB" x1="0" x2="1"><stop stop-color="#9bd36f"/><stop offset="1" stop-color="#4d9b4f"/></linearGradient></defs>
            <path d="M120 82c-39-22-78 15-76 65 2 49 34 82 70 72 8-2 17-2 25 0 36 10 68-23 70-72 2-50-37-87-76-65-4 2-9 2-13 0z" fill="url(#appleB)"/>
            <path d="M126 88c5-28 23-43 49-45" fill="none" stroke="#6c7f3d" stroke-width="13" stroke-linecap="round"/>
            <path d="M146 68c19-22 52-21 68 1-23 19-51 20-68-1z" fill="url(#leafB)"/>
            <ellipse cx="86" cy="128" rx="17" ry="26" fill="#ffd5cd" opacity=".72"/>
            <path d="M80 176c20 24 52 33 86 12" fill="none" stroke="#9f2035" stroke-width="8" stroke-linecap="round" opacity=".25"/>
          </svg>
        </div><strong>apple</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <defs><radialGradient id="orangeB" cx="35%" cy="30%" r="72%"><stop offset="0" stop-color="#ffc56d"/><stop offset=".42" stop-color="#ff971f"/><stop offset="1" stop-color="#df6f13"/></radialGradient><linearGradient id="leafOB" x1="0" x2="1"><stop stop-color="#a0d76f"/><stop offset="1" stop-color="#4a9a4e"/></linearGradient></defs>
            <circle cx="128" cy="145" r="66" fill="url(#orangeB)"/>
            <path d="M128 84c8-28 26-42 52-39" fill="none" stroke="#6c7f3d" stroke-width="13" stroke-linecap="round"/>
            <path d="M143 68c20-21 51-18 66 4-22 17-49 17-66-4z" fill="url(#leafOB)"/>
            <ellipse cx="101" cy="121" rx="16" ry="20" fill="#ffd08a" opacity=".72"/>
            <g fill="#e57816" opacity=".38"><circle cx="93" cy="156" r="5"/><circle cx="138" cy="111" r="4"/><circle cx="157" cy="160" r="5"/><circle cx="124" cy="178" r="4"/></g>
          </svg>
        </div><strong>orange</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <defs><linearGradient id="bananaB" x1="0" x2="1"><stop stop-color="#ffe36b"/><stop offset=".52" stop-color="#ffc64f"/><stop offset="1" stop-color="#e49a29"/></linearGradient></defs>
            <path d="M48 106c29 70 103 101 166 42-38 72-130 91-178-14 8-2 12-12 12-28z" fill="url(#bananaB)"/>
            <path d="M58 106c34 55 91 76 143 42" fill="none" stroke="#fff2a3" stroke-width="9" stroke-linecap="round" opacity=".8"/>
            <path d="M60 137c30 47 82 61 134 29" fill="none" stroke="#cb7b24" stroke-width="8" stroke-linecap="round" opacity=".45"/>
            <path d="M36 128c8 6 17 8 26 4M205 151c9-5 15-12 20-22" stroke="#7a4a1f" stroke-width="11" stroke-linecap="round"/>
          </svg>
        </div><strong>banana</strong></div>
      </div>
    </section>

    <section class="style-row">
      <div class="style-head">
        <h2>C. 贴纸拟物风</h2>
        <p class="desc">更可爱、更饱满，边缘更明显</p>
      </div>
      <div class="cards">
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <defs><linearGradient id="appleC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8f85"/><stop offset=".58" stop-color="#f1505a"/><stop offset="1" stop-color="#ba2a3c"/></linearGradient></defs>
            <path d="M120 82c-38-25-82 12-80 66 2 57 39 88 75 75 9-3 18-3 27 0 36 13 73-18 75-75 2-54-42-91-80-66-5 3-12 3-17 0z" fill="url(#appleC)" stroke="#8f2633" stroke-width="8" stroke-linejoin="round"/>
            <path d="M127 88c3-30 23-48 53-50" fill="none" stroke="#5e7232" stroke-width="14" stroke-linecap="round"/>
            <path d="M148 67c22-24 57-22 74 1-24 22-54 22-74-1z" fill="#72bd5f" stroke="#4e914c" stroke-width="7" stroke-linejoin="round"/>
            <ellipse cx="90" cy="125" rx="15" ry="23" fill="#ffd8d1"/>
          </svg>
        </div><strong>apple</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <defs><linearGradient id="orangeC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc064"/><stop offset=".55" stop-color="#ff9218"/><stop offset="1" stop-color="#d76412"/></linearGradient></defs>
            <circle cx="128" cy="146" r="68" fill="url(#orangeC)" stroke="#bf5d16" stroke-width="8"/>
            <path d="M128 85c8-31 29-47 60-42" fill="none" stroke="#5e7232" stroke-width="14" stroke-linecap="round"/>
            <path d="M146 68c23-24 58-20 74 5-25 20-55 19-74-5z" fill="#72bd5f" stroke="#4e914c" stroke-width="7" stroke-linejoin="round"/>
            <ellipse cx="100" cy="119" rx="15" ry="20" fill="#ffd38a"/>
            <g fill="#cf6815" opacity=".45"><circle cx="96" cy="154" r="5"/><circle cx="139" cy="112" r="4"/><circle cx="158" cy="164" r="5"/></g>
          </svg>
        </div><strong>orange</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256">
            <path d="M48 105c29 72 106 103 170 40-40 78-137 93-183-14 9-1 13-11 13-26z" fill="#ffd45d" stroke="#9f6424" stroke-width="8" stroke-linejoin="round"/>
            <path d="M61 108c35 58 92 78 145 39" fill="none" stroke="#fff1a0" stroke-width="10" stroke-linecap="round"/>
            <path d="M62 139c30 48 84 62 136 25" fill="none" stroke="#c47825" stroke-width="8" stroke-linecap="round"/>
            <path d="M35 128c8 6 18 8 28 4M209 148c8-5 14-12 18-22" stroke="#6f411b" stroke-width="12" stroke-linecap="round"/>
          </svg>
        </div><strong>banana</strong></div>
      </div>
    </section>

    <section class="style-row">
      <div class="style-head">
        <h2>D. 小绘本风</h2>
        <p class="desc">更温柔，但真实感最低一点</p>
      </div>
      <div class="cards">
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><path d="M121 84c-39-21-76 15-73 64 3 52 37 82 70 70 7-2 15-2 22 0 33 12 67-18 70-70 3-49-34-85-73-64-5 3-11 3-16 0z" fill="#f45e64"/><path d="M130 88c5-29 23-43 50-43" fill="none" stroke="#667b3a" stroke-width="10" stroke-linecap="round"/><path d="M147 70c20-18 47-17 63 1-20 18-46 20-63-1z" fill="#82c96f"/><path d="M79 142c4-25 17-43 36-51" fill="none" stroke="#ffb0aa" stroke-width="9" stroke-linecap="round"/></svg>
        </div><strong>apple</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><circle cx="128" cy="146" r="64" fill="#fb961f"/><path d="M129 86c7-27 26-41 51-38" fill="none" stroke="#667b3a" stroke-width="10" stroke-linecap="round"/><path d="M145 70c20-18 47-15 61 4-20 15-45 15-61-4z" fill="#82c96f"/><path d="M84 143c5-26 22-43 45-50" fill="none" stroke="#ffc77b" stroke-width="10" stroke-linecap="round"/><circle cx="153" cy="165" r="5" fill="#dc7116"/></svg>
        </div><strong>orange</strong></div>
        <div class="card"><div class="frame">
          <svg viewBox="0 0 256 256"><path d="M52 106c31 67 101 95 160 44-42 72-127 82-174-17 8-3 12-12 14-27z" fill="#ffd25b"/><path d="M63 109c32 53 88 73 138 40" fill="none" stroke="#fff0a1" stroke-width="8" stroke-linecap="round"/><path d="M63 139c29 45 80 58 130 25" fill="none" stroke="#d4892b" stroke-width="7" stroke-linecap="round"/><path d="M39 129c7 4 14 5 22 3M207 149c8-5 14-12 18-21" stroke="#7a4a1f" stroke-width="9" stroke-linecap="round"/></svg>
        </div><strong>banana</strong></div>
      </div>
    </section>
  </main>
</body>
</html>
