<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BabyEng Real Screenshot Cover</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      font-family: "Hiragino Sans GB", "STHeiti", "PingFang SC", "Arial", sans-serif;
      background: #fff6e8;
    }

    .cover {
      position: relative;
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      color: #061852;
      background: #fff6e8;
    }

    .screenshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .copy {
      position: absolute;
      top: 62px;
      left: 44px;
      width: 270px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      height: 54px;
      padding: 0 16px;
      border: 4px solid #061852;
      border-radius: 999px;
      background: #fff;
      color: #061852;
      font-size: 24px;
      font-weight: 950;
      box-shadow: 6px 6px 0 #f2b35f;
    }

    h1 {
      margin: 34px 0 0;
      color: #061852;
      font-size: 50px;
      line-height: 1.08;
      font-weight: 950;
      letter-spacing: 0;
    }

    .highlight {
      display: inline-block;
      margin-top: 10px;
      padding: 0 10px 7px;
      border-radius: 10px;
      background: #ffe36a;
    }

    .subtitle {
      width: 260px;
      margin-top: 26px;
      color: #243160;
      font-size: 25px;
      line-height: 1.36;
      font-weight: 850;
    }

    .bottom {
      position: absolute;
      left: 44px;
      bottom: 58px;
      width: 270px;
      padding: 24px 24px;
      border: 4px solid #061852;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 9px 9px 0 #9bddc4;
    }

    .bottom-title {
      font-size: 30px;
      line-height: 1.22;
      font-weight: 950;
      color: #061852;
    }

    .bottom-text {
      margin-top: 10px;
      font-size: 22px;
      line-height: 1.34;
      font-weight: 850;
      color: #5a6480;
    }
  </style>
</head>
<body>
  <main class="cover">
    <img class="screenshot" src="babyeng-kitchen-detail-large.png" alt="Little English 厨房场景真实截图" />

    <section class="copy">
      <div class="kicker">2-6岁英语启蒙</div>
      <h1>
        不是背单词<br />
        是在场景里<br />
        <span class="highlight">听懂英语</span>
      </h1>
      <div class="subtitle">孩子熟悉的东西，更容易开口。</div>
    </section>

    <section class="bottom">
      <div class="bottom-title">真实 App 截图</div>
      <div class="bottom-text">每天 5 分钟，把英语和生活里的东西连起来。</div>
    </section>
  </main>
</body>
</html>
