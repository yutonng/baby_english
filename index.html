<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A simple H5 English learning app for young Chinese-speaking children."
    />
    <meta name="theme-color" content="#FFF7ED" />
    <meta property="og:title" content="Little English" />
    <meta property="og:description" content="Scene-based English words and sentences for kids." />
    <meta property="og:type" content="website" />
    <title>Little English</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd166'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle'%3E📘%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css?v=figma-card-20260628p" />
  </head>
  <body>
    <main class="app-shell">
      <section class="home-view" id="homeView" aria-labelledby="homeTitle">
        <header class="top-bar">
          <div class="app-brand">
            <div>
              <h1 id="homeTitle">Little English</h1>
            </div>
          </div>
          <div class="top-actions" aria-label="工具">
            <button class="top-icon-button" type="button" id="searchButton" aria-label="搜索">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.5 16.5 4 4" />
              </svg>
            </button>
            <button class="top-icon-button" type="button" id="settingsButton" aria-label="设置">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
                <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.15 2.15 0 0 1-3.04 3.04l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65V21.5a2.15 2.15 0 0 1-4.3 0v-.19a1.8 1.8 0 0 0-1.09-1.65 1.8 1.8 0 0 0-1.98.36l-.04.04a2.15 2.15 0 0 1-3.04-3.04l.04-.04A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-1.65-1.09H2.75a2.15 2.15 0 0 1 0-4.3h.2A1.8 1.8 0 0 0 4.6 8.52a1.8 1.8 0 0 0-.36-1.98l-.04-.04a2.15 2.15 0 0 1 3.04-3.04l.04.04a1.8 1.8 0 0 0 1.98.36 1.8 1.8 0 0 0 1.09-1.65V2a2.15 2.15 0 0 1 4.3 0v.21a1.8 1.8 0 0 0 1.09 1.65 1.8 1.8 0 0 0 1.98-.36l.04-.04a2.15 2.15 0 0 1 3.04 3.04l-.04.04a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.09h.2a2.15 2.15 0 0 1 0 4.3h-.2A1.8 1.8 0 0 0 19.4 15Z" />
              </svg>
            </button>
          </div>
        </header>

        <div class="scene-grid" id="sceneGrid"></div>
      </section>

      <section class="scene-view is-hidden" id="sceneView" aria-labelledby="sceneTitle">
        <header class="scene-header">
          <button class="back-button" type="button" id="backButton" aria-label="返回">
            <span aria-hidden="true"></span>
          </button>
          <div>
            <p class="eyebrow" id="sceneSubtitle"></p>
            <h2 id="sceneTitle"></h2>
          </div>
        </header>

        <div class="word-grid" id="wordGrid"></div>
      </section>

      <div class="word-sheet is-hidden" id="wordSheet" role="dialog" aria-modal="true" aria-labelledby="sheetWord">
        <button class="sheet-close" type="button" id="closeSheet" aria-label="关闭">×</button>
        <div class="sheet-picture" id="sheetPicture"></div>
        <p class="word-label" id="sheetWord"></p>
        <button class="sound-row" type="button" id="wordSoundButton">
          <span>▶</span>
          <strong id="wordSoundText"></strong>
        </button>
        <button class="sentence-row" type="button" id="sentenceSoundButton">
          <span>▶</span>
          <strong id="sheetSentence"></strong>
        </button>
      </div>
      <div class="settings-sheet is-hidden" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button class="sheet-close" type="button" id="closeSettings" aria-label="关闭">×</button>
        <h2 id="settingsTitle">设置</h2>
        <div class="settings-row">
          <span>版本号</span>
          <strong id="versionText">0.1.0</strong>
        </div>
      </div>
      <section class="search-view is-hidden" id="searchView" aria-label="搜索">
        <div class="search-top">
          <button class="search-back-button" type="button" id="closeSearch" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <div class="inline-search" id="searchInputWrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m16.5 16.5 4 4" />
            </svg>
            <input id="sceneSearchInput" type="search" placeholder="搜索场景或单词" autocomplete="off" />
            <button type="button" id="clearSearchButton" aria-label="清空搜索">×</button>
          </div>
        </div>
        <div class="scene-grid" id="searchGrid"></div>
      </section>
      <div class="scrim is-hidden" id="scrim"></div>
      <div class="audio-toast is-hidden" id="audioToast" role="status" aria-live="polite"></div>
    </main>

    <script src="./build-env.js?v=figma-card-20260628p"></script>
    <script src="./app.js?v=figma-card-20260628p"></script>
  </body>
</html>
